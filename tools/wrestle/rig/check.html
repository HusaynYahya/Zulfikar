<!doctype html>
<html><head><meta charset="utf-8"><title>Rig check</title>
<style>
  html,body{margin:0;background:#3a3f4c}
  #wrap{position:relative;width:1556px;height:912px;overflow:hidden}
  canvas{position:absolute;left:0;top:0;width:1556px;height:912px}
  img{position:absolute;left:10px;top:-28px;width:1536px;opacity:.45;filter:invert(1) sepia(1) saturate(6) hue-rotate(-50deg);mix-blend-mode:screen}
</style></head>
<body>
<!-- ?t=0.5&ref=1  → the rig at τ = 0.5 over drawing raw/1.png -->
<div id="wrap"><img id="ref" alt=""><canvas id="c"></canvas></div>
<script src="../../../assets/js/rigdata.js"></script>
<script src="../../../assets/js/lineart.js"></script>
<script>
  var q = new URLSearchParams(location.search), cv = document.getElementById("c"), ref = document.getElementById("ref");
  if (q.get("ref")) ref.src = "../raw/" + q.get("ref") + ".png"; else ref.remove();
  ZLineArt.init(cv);
  cv.width = 1556; cv.height = 912; cv._wr.line.width = cv._wr.fill.width = 1556; cv._wr.line.height = cv._wr.fill.height = 912;
  // hold the engine's own glide at the same moment, then draw once it has settled
  window.draw = function (t) { cv._wr.target = cv._wr.cur = t; ZLineArt._render(cv, t); };
  var t0 = parseFloat(q.get("t") || "0");
  requestAnimationFrame(function () { requestAnimationFrame(function () { draw(t0); window.ready = true; }); });
</script>
</body></html>
